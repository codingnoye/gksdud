name: Update Homebrew tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published stable release tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: update-homebrew-tap
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'codingnoye/gksdud' && ((github.event_name == 'release' && !github.event.release.prerelease) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - name: Verify published assets and open tap PR
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          test -n "$TAP_GITHUB_TOKEN" || { echo 'Set TAP_GITHUB_TOKEN for codingnoye/homebrew-tap (Contents and Pull requests write).' >&2; exit 1; }
          python3 scripts/update-tap.py "$RELEASE_TAG"
