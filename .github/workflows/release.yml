name: Release

on:
  # Every push to main publishes a canary; prereleases come from their tags, vX.Y.Z.P.
  # A push of only documents, the download page or test tools leaves the app as it was; its commits go in the next canary.
  push:
    branches: [main]
    tags: ['v*.*.*.*']
    paths-ignore: ['**.md', 'docs/**', 'site/**', 'scripts/build-site.py', 'scripts/test_build_site.py', 'skills/**', 'tests/**']
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or commit to release
        required: true
        type: string
        default: main
      version:
        description: New stable version (for example 1.3.2)
        required: true
        type: string
      release_summary:
        description: User-facing release summary
        required: true
        type: string
      release_warning:
        description: What users must know before installing, confirmed in the app before an update (optional)
        required: false
        type: string
      make_latest:
        description: Mark as GitHub's latest release; apps up to 1.7.1 update only to the latest
        required: false
        type: boolean
        default: true

permissions:
  contents: read

# Canary has a group of its own, so a waiting canary never takes a waiting manual release's place.
concurrency:
  group: release-${{ github.repository }}-${{ github.event_name == 'push' && github.ref_type == 'branch' && 'canary' || 'manual' }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'codingnoye/gksdud' && ((github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    outputs:
      stable_tag: ${{ github.event_name == 'workflow_dispatch' && steps.version.outputs.prerelease == 'false' && steps.version.outputs.tag || '' }}
    defaults:
      run:
        shell: bash
    steps:
      # With history and tags: a canary is numbered by the commits since the latest stable release, and lists them.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # A canary does not wait for Checks, so the release scripts are tested here; build.sh runs the app's self-tests.
      - name: Test release scripts
        run: |
          set -euo pipefail
          ruby scripts/test_release.rb
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p test_update_tap.py

      - name: Resolve source and validate release version
        id: version
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_SUMMARY: ${{ inputs.release_summary }}
        run: |
          set -euo pipefail
          # Never relabel changed application code as an existing version.
          ruby scripts/resolve-release.rb >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ steps.version.outputs.source_sha }}
          path: release-source
          persist-credentials: false

      - name: Prepare selected source version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          test -s release-source/LICENSE
          test -f release-source/build.sh
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $RELEASE_VERSION" release-source/Info.plist

      - name: Import Developer ID identity, notary key and the self-signed identity for old apps
        env:
          CERTIFICATE_BASE64: ${{ secrets.GKSDUD_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.GKSDUD_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.GKSDUD_NOTARY_KEY_BASE64 }}
          SELF_SIGNED_FILENAME: ${{ steps.version.outputs.self_signed_filename }}
          SELF_SIGNED_BASE64: ${{ secrets.GKSDUD_CERTIFICATE_P12_BASE64 }}
          SELF_SIGNED_PASSWORD: ${{ secrets.GKSDUD_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          : "${CERTIFICATE_BASE64:?Missing signing certificate secret}"
          : "${P12_PASSWORD:?Missing P12 password secret}"
          : "${NOTARY_KEY_BASE64:?Missing notary key secret}"
          keychain="$RUNNER_TEMP/gksdud-signing.keychain-db"
          certificate="$RUNNER_TEMP/gksdud-signing.p12"
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$P12_PASSWORD" -k "$keychain" -T /usr/bin/codesign
          security import signing/DeveloperIDG2CA.cer -k "$keychain"
          if [[ -n "$SELF_SIGNED_FILENAME" ]]; then
            : "${SELF_SIGNED_BASE64:?Missing self-signed certificate secret}"
            : "${SELF_SIGNED_PASSWORD:?Missing self-signed P12 password secret}"
            printf '%s' "$SELF_SIGNED_BASE64" | base64 --decode > "$RUNNER_TEMP/gksdud-self-signed.p12"
            security import "$RUNNER_TEMP/gksdud-self-signed.p12" -P "$SELF_SIGNED_PASSWORD" -k "$keychain" -T /usr/bin/codesign
            rm -f "$RUNNER_TEMP/gksdud-self-signed.p12"
            security find-certificate -c 'CodingNoye gksdud Local Signing' -p "$keychain" > signing/local-certificate.pem
            actual=$(openssl x509 -in signing/local-certificate.pem -noout -fingerprint -sha1 | cut -d= -f2 | tr -d ':')
            [[ "$actual" == "$(tr -d '\n\r' < signing/release-certificate.sha1)" ]] || { echo 'Self-signed identity changed; refusing release.'; exit 1; }
            mkdir -p release-source/signing
            cp signing/local-certificate.pem release-source/signing/local-certificate.pem
            # Ephemeral GitHub-hosted runner only; code signing policy, not TLS trust.
            sudo security add-trusted-cert -d -r trustRoot -p codeSign -k "$keychain" signing/local-certificate.pem
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          rm -f "$certificate"
          team=$(tr -d '\n\r' < signing/developer-team-id)
          identities=$(security find-identity -v -p codesigning "$keychain" |
            sed -n -E "s/^ *[0-9]+\) ([0-9A-F]{40}) \"Developer ID Application: .* \($team\)\"$/\1/p")
          [[ "$identities" =~ ^[0-9A-F]{40}$ ]] || { echo 'Expected one Developer ID Application identity of the team; refusing release.'; exit 1; }
          echo "GKSDUD_SIGN_IDENTITY=$identities" >> "$GITHUB_ENV"
          mkdir "$RUNNER_TEMP/gksdud-notary"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/gksdud-notary/AuthKey.p8"

      - name: Build, self-test and notarize Universal app and disk image
        working-directory: release-source
        env:
          GKSDUD_SIGN_MODE: developer-id
          GKSDUD_CHANNEL: ${{ steps.version.outputs.channel == 'canary' && 'canary' || 'stable' }}
          GKSDUD_APP_VERSION: ${{ steps.version.outputs.version }}
          GKSDUD_NOTARY_KEY: ${{ runner.temp }}/gksdud-notary/AuthKey.p8
          GKSDUD_NOTARY_KEY_ID: ${{ secrets.GKSDUD_NOTARY_KEY_ID }}
          GKSDUD_NOTARY_ISSUER: ${{ secrets.GKSDUD_NOTARY_ISSUER }}
          GKSDUD_SELF_SIGNED_COPY: ${{ steps.version.outputs.self_signed_filename != '' && '1' || '' }}
        run: bash build.sh

      - name: Verify archive and prepare release metadata
        env:
          GKSDUD_RELEASE_TAG: ${{ steps.version.outputs.tag }}
          GKSDUD_SOURCE_ROOT: ${{ github.workspace }}/release-source
          GKSDUD_APP_VERSION: ${{ steps.version.outputs.version }}
        run: ruby scripts/prepare-release.rb "$GITHUB_REPOSITORY"

      - name: Create tag for the verified source
        if: steps.version.outputs.tag_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$SOURCE_SHA"

      - name: Verify existing release without overwriting it
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          FILENAME: ${{ steps.version.outputs.filename }}
          SELF_SIGNED_FILENAME: ${{ steps.version.outputs.self_signed_filename }}
          DMG_FILENAME: ${{ steps.version.outputs.dmg_filename }}
          GKSDUD_RELEASE_TAG: ${{ steps.version.outputs.tag }}
          GKSDUD_SOURCE_ROOT: ${{ github.workspace }}/release-source
          GKSDUD_APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')
          if printf '%s\n' "$releases" | grep -Fxq "$TAG"; then
            existing_dir=$(mktemp -d "$RUNNER_TEMP/gksdud-existing.XXXXXX")
            names=("$FILENAME" ${SELF_SIGNED_FILENAME:+"$SELF_SIGNED_FILENAME"})
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$existing_dir" --pattern SHA256SUMS
            # Releases before the disk image have none.
            if grep -Fq "  $DMG_FILENAME" "$existing_dir/SHA256SUMS"; then names+=("$DMG_FILENAME"); fi
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$existing_dir" "${names[@]/#/--pattern=}"
            ruby -rdigest -e 'dir, *names = ARGV; expected = names.map { |name| "#{Digest::SHA256.file(File.join(dir, name)).hexdigest}  #{name}\n" }.join; abort "Published checksum mismatch" unless File.read(File.join(dir, "SHA256SUMS")) == expected' "$existing_dir" "${names[@]}"
            ruby scripts/prepare-release.rb "$GITHUB_REPOSITORY" "${names[@]/#/$existing_dir/}"
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo 'Existing release verified. No assets will be replaced.'
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Remove temporary signing credentials
        if: always()
        timeout-minutes: 2
        run: bash scripts/cleanup-signing.sh

      - name: Create stable draft or publish prerelease or canary (never overwrite existing assets)
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          CHANNEL: ${{ steps.version.outputs.channel }}
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
          ASSET_VERSION: ${{ steps.version.outputs.asset_version }}
          FILENAME: ${{ steps.version.outputs.filename }}
          SELF_SIGNED_FILENAME: ${{ steps.version.outputs.self_signed_filename }}
          DMG_FILENAME: ${{ steps.version.outputs.dmg_filename }}
          SOURCE_ROOT: ${{ github.workspace }}/release-source
        run: |
          set -euo pipefail
          options=(--draft --title "gksdud $VERSION" --notes-file .github/RELEASE_NOTES.md)
          if [[ "$CHANNEL" != stable ]]; then
            notes=$(mktemp "${RUNNER_TEMP:-/tmp}/gksdud-$CHANNEL-notes.XXXXXX")
          fi
          if [[ "$CHANNEL" == pre ]]; then
            # The annotated tag's message goes above the notes: the app shows its ### 요약 and confirms its ### 경고.
            read -r type sha < <(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')
            if [[ "$type" == tag ]]; then gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .message > "$notes"; printf '\n' >> "$notes"; fi
            cat .github/PRERELEASE_NOTES.md >> "$notes"
            options=(--prerelease --latest=false --title "gksdud $VERSION Pre-release" --notes-file "$notes" --generate-notes)
          elif [[ "$CHANNEL" == canary ]]; then
            # The commits since the previous canary or stable release, each as its hash and title: the app's summary of this one.
            since='' nearest=''
            for tag in $(git tag --list 'v*' --merged "$SOURCE_SHA^" 2>/dev/null | grep -E '^v[0-9]+(\.[0-9]+){2}$|^v[0-9]+(\.[0-9]+){4}$'); do
              count=$(git rev-list --count "$tag..$SOURCE_SHA")
              if [[ -z $nearest ]] || (( count < nearest )); then nearest=$count since=$tag; fi
            done
            range=${since:+$since..}$SOURCE_SHA
            { echo '### 요약'; git log -n 20 --format="- [%h](https://github.com/$GITHUB_REPOSITORY/commit/%H) %s" "$range"
              more=$(( $(git rev-list --count "$range") - 20 )); (( more <= 0 )) || echo "- 외 커밋 ${more}개"
              echo; cat .github/CANARY_NOTES.md; } > "$notes"
            options=(--prerelease --latest=false --title "gksdud $VERSION Canary" --notes-file "$notes")
          fi
          gh release create "$TAG" \
            "$SOURCE_ROOT/outputs/$FILENAME" ${SELF_SIGNED_FILENAME:+"$SOURCE_ROOT/outputs/$SELF_SIGNED_FILENAME"} \
            "$SOURCE_ROOT/outputs/$DMG_FILENAME" \
            "$SOURCE_ROOT/outputs/release-$ASSET_VERSION/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            "${options[@]}"

      - name: Keep the latest canary releases
        if: steps.version.outputs.channel == 'canary'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The app reads the latest hundred releases; older canaries would push stable releases out of them.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' |
            { grep -E '^v[0-9]+(\.[0-9]+){4}$' || true; } | tail -n +21 |
            while read -r tag; do gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag; done

      - name: Publish verified stable draft
        if: github.event_name == 'workflow_dispatch' && steps.version.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SUMMARY: ${{ inputs.release_summary }}
          RELEASE_WARNING: ${{ inputs.release_warning }}
          MAKE_LATEST: ${{ inputs.make_latest }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: ruby scripts/publish-release.rb "$GITHUB_REPOSITORY" "$RELEASE_TAG"

      - name: Verify published assets and open Homebrew update PR
        if: github.event_name == 'workflow_dispatch' && steps.version.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          test -n "$TAP_GITHUB_TOKEN" || { echo 'Missing Homebrew tap token.' >&2; exit 1; }
          python3 scripts/update-tap.py "$RELEASE_TAG"

      # A canary tag without its release would be taken as the previous canary, leaving its commits out of the next notes.
      - name: Remove the tag of a canary that was not published
        if: (failure() || cancelled()) && steps.version.outputs.channel == 'canary' && steps.version.outputs.tag_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Only when GitHub says there is no such release, not when asking failed.
          if ! answer=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" 2>&1 >/dev/null) && [[ $answer == *'HTTP 404'* ]]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" || true
          fi

  # The download page moves to a stable release as soon as it is published.
  pages:
    needs: release
    if: needs.release.outputs.stable_tag != ''
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      tag: ${{ needs.release.outputs.stable_tag }}
