name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build or verify using the latest workflow
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'codingnoye/gksdud' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: macos-15
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate tag and release prerequisites
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            tag="$REQUESTED_TAG"
            [[ "$tag" == "v$version" ]]
            git fetch --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
            # Never relabel changed application code as an existing version.
            git diff --exit-code "$tag" HEAD -- main.swift DudIcon.swift Bridge.h Info.plist build.sh LICENSE
          fi
          [[ "$tag" == "v$version" ]]
          test -s LICENSE
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Import fixed signing identity into temporary keychain
        env:
          CERTIFICATE_BASE64: ${{ secrets.GKSDUD_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.GKSDUD_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          : "${CERTIFICATE_BASE64:?Missing signing certificate secret}"
          : "${P12_PASSWORD:?Missing P12 password secret}"
          keychain="$RUNNER_TEMP/gksdud-signing.keychain-db"
          certificate="$RUNNER_TEMP/gksdud-signing.p12"
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$P12_PASSWORD" -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          security find-certificate -c 'CodingNoye gksdud Local Signing' -p "$keychain" > signing/local-certificate.pem
          actual=$(openssl x509 -in signing/local-certificate.pem -noout -fingerprint -sha1 | cut -d= -f2 | tr -d ':')
          expected=$(tr -d '\n\r' < signing/release-certificate.sha1)
          [[ "$actual" == "$expected" ]] || { echo 'Signing identity changed; refusing release.'; exit 1; }
          # Ephemeral GitHub-hosted runner only; code signing policy, not TLS trust.
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k "$keychain" signing/local-certificate.pem
          rm -f "$certificate"

      - name: Build and self-test Universal app
        env:
          GKSDUD_SIGN_MODE: local
        run: bash build.sh

      - name: Verify archive and prepare checksums and Homebrew cask
        run: ruby scripts/prepare-release.rb "$GITHUB_REPOSITORY"

      - name: Verify existing release without overwriting it
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')
          if printf '%s\n' "$releases" | grep -Fxq "$TAG"; then
            existing_dir=$(mktemp -d "$RUNNER_TEMP/gksdud-existing.XXXXXX")
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$existing_dir" \
              --pattern "gksdud-$VERSION-macos-universal.zip" --pattern SHA256SUMS
            ruby -rdigest -e 'dir, version = ARGV; name = "gksdud-#{version}-macos-universal.zip"; expected = "#{Digest::SHA256.file(File.join(dir, name)).hexdigest}  #{name}\n"; abort "Published checksum mismatch" unless File.read(File.join(dir, "SHA256SUMS")) == expected' "$existing_dir" "$VERSION"
            ruby scripts/prepare-release.rb "$GITHUB_REPOSITORY" "$existing_dir/gksdud-$VERSION-macos-universal.zip"
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo 'Existing release verified. No assets will be replaced.'
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Remove temporary signing credentials
        if: always()
        timeout-minutes: 2
        run: bash scripts/cleanup-signing.sh

      - name: Create draft release (never overwrite existing assets)
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "outputs/gksdud-$VERSION-macos-universal.zip" \
            "outputs/release-$VERSION/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "gksdud $VERSION" --notes-file .github/RELEASE_NOTES.md
