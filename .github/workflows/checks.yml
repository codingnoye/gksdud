name: Checks

on:
  # Edits do not trigger this: a skipped job on the same commit would count as passing. The title has its own workflow.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and self-test
    # A draft cannot be merged; ready_for_review runs it.
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n build.sh scripts/cleanup-signing.sh signing/setup-local-signing.sh signing/verify-update-identity.sh
          ruby -c scripts/prepare-release.rb
          ruby scripts/test_release.rb
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p test_update_tap.py
          python3 scripts/run-with-timeout.py 2 /usr/bin/true
          if python3 scripts/run-with-timeout.py 0.1 /bin/sleep 5; then
            echo 'Timeout test unexpectedly succeeded' >&2
            exit 1
          else
            test "$?" -eq 124
          fi
      - name: Build Universal app and run self-tests
        env:
          GKSDUD_SIGN_MODE: ad-hoc
        run: bash build.sh
      - name: Diagnose a self-test crash
        if: failure()
        shell: bash
        run: |
          for binary in /private/tmp/gksdud-build.*/test/gksdud.app/Contents/MacOS/gksdud; do
            if [[ -f "$binary" ]]; then
              lldb --batch -o run --one-line-on-crash 'thread backtrace all' -- "$binary" --self-test
              break
            fi
          done
