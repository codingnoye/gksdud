name: Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check PR title prefix
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 -c 'import os,re,sys; sys.exit(0 if re.fullmatch(r"\[(FEAT|FIX|CHORE|DOCS|REFACTOR|TEST|CI|PERF|BUILD|REVERT)\] \S.*", os.environ["PR_TITLE"]) else "Use a title such as [FEAT] Description or [FIX] Description")'
  build:
    name: Build and self-test
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n build.sh scripts/cleanup-signing.sh signing/setup-local-signing.sh signing/verify-update-identity.sh
          ruby -c scripts/prepare-release.rb
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p test_update_tap.py
          python3 scripts/run-with-timeout.py 2 /usr/bin/true
          if python3 scripts/run-with-timeout.py 0.1 /bin/sleep 5; then
            echo 'Timeout test unexpectedly succeeded' >&2
            exit 1
          else
            test "$?" -eq 124
          fi
      - name: Build Universal app and run self-tests
        env:
          GKSDUD_SIGN_MODE: ad-hoc
        run: bash build.sh
